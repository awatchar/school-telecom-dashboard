name: Sync dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync Dashboard_Data
        run: node scripts/sync-data.mjs

      - name: Validate dashboard data
        run: node scripts/validate.mjs

      - name: Commit data changes
        run: |
          if [ -z "$(git status --porcelain -- data/schools.json)" ]; then
            echo "Dashboard data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schools.json
          git commit -m "Sync dashboard data"
          git push
